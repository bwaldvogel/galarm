[package]
name = "galarm"
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
description = "Pops up an alarm message and plays a sound after a configurable time"
license = "MIT"
repository = "https://github.com/bwaldvogel/galarm"

[dependencies]
jiff = "0.2"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
signal-hook = "0.4.5"
zbus = "5"

[profile.release]
strip = true
